name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross_platform_smoke:
    name: Cross-Platform Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Import smoke
        run: python -c "from src.artifacts.safety import portable_path; print(portable_path('docs\\manifest.json'))"

      - name: Run focused ruff slice
        run: >
          python -m ruff check
          tests/test_cross_platform_reproducibility_audit.py
          tests/test_portable_paths.py
          tests/test_line_ending_policy.py
          tests/test_docs_path_portability.py

      - name: Run focused cross-platform pytest slice
        run: >
          python -m pytest
          tests/test_cross_platform_reproducibility_audit.py
          tests/test_portable_paths.py
          tests/test_line_ending_policy.py
          tests/test_docs_path_portability.py
          tests/test_promotion_governance.py
          tests/test_campaign_milestone_reporting.py

      - name: Run docs/path lint
        run: python -m src.cli.run_docs_path_lint --output artifacts/qa/docs_path_lint_${{ matrix.os }}.json

      - name: Upload docs/path lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-path-lint-${{ matrix.os }}
          path: artifacts/qa/docs_path_lint_${{ matrix.os }}.json
          if-no-files-found: error

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check src/ tests/

  docs_path_lint:
    name: Docs Path Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run docs/path lint
        run: python -m src.cli.run_docs_path_lint --output artifacts/qa/docs_path_lint.json

      - name: Upload docs/path lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-path-lint-report
          path: artifacts/qa/docs_path_lint.json
          if-no-files-found: error

  deterministic_rerun:
    name: Deterministic Rerun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run deterministic rerun validation
        run: python -m src.cli.run_deterministic_rerun_validation --output artifacts/qa/deterministic_rerun.json

      - name: Upload deterministic rerun report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-rerun-report
          path: artifacts/qa/deterministic_rerun.json
          if-no-files-found: error

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest --tb=short -q
