name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# GitHub-maintained actions pinned for M36 supply-chain hardening:
# actions/checkout@v4 -> 34e114876b0b11c390a56381ad16ebd13914f8d5
# actions/setup-python@v5 -> a26af69be951a213d495a4c3e4e4022e16d87065
# actions/upload-artifact@v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross_platform_smoke:
    name: Cross-Platform Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock

      - name: Import smoke
        run: python -c "from src.artifacts.safety import portable_path; print(portable_path('docs\\manifest.json'))"

      - name: Run focused ruff slice
        run: >
          python -m ruff check
          tests/test_cross_platform_reproducibility_audit.py
          tests/test_portable_paths.py
          tests/test_line_ending_policy.py
          tests/test_docs_path_portability.py
          tests/test_packaging_readiness.py
          tests/test_dependency_reproducibility.py
          tests/test_release_workflow.py
          tests/test_github_actions_pinning.py

      - name: Run focused cross-platform pytest slice
        run: >
          python -m pytest
          tests/test_cross_platform_reproducibility_audit.py
          tests/test_portable_paths.py
          tests/test_line_ending_policy.py
          tests/test_docs_path_portability.py
          tests/test_packaging_readiness.py
          tests/test_dependency_reproducibility.py
          tests/test_release_workflow.py
          tests/test_github_actions_pinning.py
          tests/test_promotion_governance.py
          tests/test_campaign_milestone_reporting.py

      - name: Run docs/path lint
        run: python -m src.cli.run_docs_path_lint --output artifacts/qa/docs_path_lint_${{ matrix.os }}.json

      - name: Upload docs/path lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-path-lint-${{ matrix.os }}
          path: artifacts/qa/docs_path_lint_${{ matrix.os }}.json
          if-no-files-found: error

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock

      - name: Run ruff
        run: python -m ruff check src/ tests/

  docs_path_lint:
    name: Docs Path Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock

      - name: Run docs/path lint
        run: python -m src.cli.run_docs_path_lint --output artifacts/qa/docs_path_lint.json

      - name: Upload docs/path lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-path-lint-report
          path: artifacts/qa/docs_path_lint.json
          if-no-files-found: error

  deterministic_rerun:
    name: Deterministic Rerun
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock

      - name: Run deterministic rerun validation
        run: python -m src.cli.run_deterministic_rerun_validation --output artifacts/qa/deterministic_rerun.json

      - name: Upload deterministic rerun report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deterministic-rerun-report
          path: artifacts/qa/deterministic_rerun.json
          if-no-files-found: error

  packaging:
    name: Packaging Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock

      - name: Validate package metadata and import
        run: python -m pytest tests/test_packaging_readiness.py

      - name: Build wheel and source distribution
        run: python -m build

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock

      - name: Run pytest
        run: python -m pytest --tb=short -q
