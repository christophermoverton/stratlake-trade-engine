name: Milestone Branch Validation

on:
  push:
    branches:
      - "feature/m*"
      - "feature/issue-476-session-archive-bootstrap-command"
    tags:
      - "v0.43.*"

permissions:
  contents: read

# Branch-push validation is intentionally focused and credential-free. Pull
# requests into main continue to run the broader CI and milestone validation
# workflows; release and publishing workflows remain tag/manual only.
#
# GitHub-maintained actions pinned for M36 supply-chain hardening:
# actions/checkout@v4 -> 34e114876b0b11c390a56381ad16ebd13914f8d5
# actions/setup-python@v5 -> a26af69be951a213d495a4c3e4e4022e16d87065

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m43-session-archive-validation:
    name: M43 Session Archive Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock

      - name: Run M43 manifest and writer tests
        run: >
          python -m pytest
          tests/test_session_archive_bootstrap_cli.py
          tests/test_session_archive_restore_bootstrap_cli.py
          tests/test_session_archive_manifest.py
          tests/test_session_archive_restore.py
          tests/test_session_archive_cli.py
          tests/test_session_archive_roundtrip_validation.py
          tests/test_session_archive_validation.py
          tests/test_session_archive_writer.py

      - name: Run M43 ruff check
        run: >
          python -m ruff check
          src/session_archive
          src/cli/session_archive_bootstrap.py
          src/cli/session_archive_restore_bootstrap.py
          src/cli/session_archive.py
          tests/test_session_archive_bootstrap_cli.py
          tests/test_session_archive_restore_bootstrap_cli.py
          tests/test_session_archive_cli.py
          tests/test_session_archive_manifest.py
          tests/test_session_archive_restore.py
          tests/test_session_archive_roundtrip_validation.py
          tests/test_session_archive_validation.py
          tests/test_session_archive_writer.py
          docs/session_archives.md

      - name: Run M43 Python format check
        run: >
          python -m ruff format --check
          src/session_archive
          src/cli/session_archive_bootstrap.py
          src/cli/session_archive_restore_bootstrap.py
          src/cli/session_archive.py
          tests/test_session_archive_bootstrap_cli.py
          tests/test_session_archive_restore_bootstrap_cli.py
          tests/test_session_archive_cli.py
          tests/test_session_archive_manifest.py
          tests/test_session_archive_restore.py
          tests/test_session_archive_roundtrip_validation.py
          tests/test_session_archive_validation.py
          tests/test_session_archive_writer.py

      - name: Run M43 docs format check
        run: python -m ruff format --check --preview docs/session_archives.md

  m44-marketlake-handoff-validation:
    name: M44 MarketLake Handoff Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock

      - name: Run M44 handoff validator tests
        run: >
          python -m pytest
          tests/test_validate_marketlake_handoff.py
          tests/test_notebook_doctor.py
          tests/test_m44_marketlake_handoff_docs.py
          tests/test_m44_notebook_doctor_docs.py
          tests/test_m44_colab_session_profile_docs.py
          tests/test_m44_restore_first_colab_docs.py
          tests/test_m44_notebook_execution_examples_docs.py
          tests/test_init_session_cli.py

      - name: Run M44 ruff check
        run: >
          python -m ruff check
          src/validation/marketlake_handoff.py
          src/validation/notebook_doctor.py
          src/cli/validate_marketlake_handoff.py
          src/cli/notebook_doctor.py
          tests/test_validate_marketlake_handoff.py
          tests/test_notebook_doctor.py
          tests/test_m44_marketlake_handoff_docs.py
          tests/test_m44_notebook_doctor_docs.py
          tests/test_m44_colab_session_profile_docs.py
          tests/test_m44_restore_first_colab_docs.py
          tests/test_m44_notebook_execution_examples_docs.py

      - name: Run M44 Python format check
        run: >
          python -m ruff format --check
          src/validation/marketlake_handoff.py
          src/validation/notebook_doctor.py
          src/cli/validate_marketlake_handoff.py
          src/cli/notebook_doctor.py
          tests/test_validate_marketlake_handoff.py
          tests/test_notebook_doctor.py
          tests/test_m44_marketlake_handoff_docs.py
          tests/test_m44_notebook_doctor_docs.py
          tests/test_m44_colab_session_profile_docs.py
          tests/test_m44_restore_first_colab_docs.py
          tests/test_m44_notebook_execution_examples_docs.py
