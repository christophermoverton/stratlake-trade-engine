name: Milestone Validation

on:
  workflow_dispatch:
  push:
    branches:
      - "milestone/**"
      - "m22/**"
      - "feature/m*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

# GitHub-maintained actions pinned for M36 supply-chain hardening:
# actions/checkout@v4 -> 34e114876b0b11c390a56381ad16ebd13914f8d5
# actions/setup-python@v5 -> a26af69be951a213d495a4c3e4e4022e16d87065
# actions/upload-artifact@v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  milestone_validation:
    name: Milestone Validation Bundle
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'milestone/') || startsWith(github.head_ref, 'm22/') || startsWith(github.head_ref, 'feature/m')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock

      - name: Run milestone validation bundle
        run: python -m src.cli.run_milestone_validation --bundle-dir artifacts/qa/milestone_validation_bundle --include-full-pytest

      - name: Upload milestone validation bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milestone-validation-bundle
          path: artifacts/qa/milestone_validation_bundle
          if-no-files-found: error
