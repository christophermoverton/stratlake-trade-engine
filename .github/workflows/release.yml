name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Actions pinned for M36 supply-chain hardening:
# actions/checkout@v4 -> 34e114876b0b11c390a56381ad16ebd13914f8d5
# actions/setup-python@v5 -> a26af69be951a213d495a4c3e4e4022e16d87065
# actions/upload-artifact@v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02
# softprops/action-gh-release@v2 -> 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    env:
      STRATLAKE_RUN_WHEEL_INSTALL_SMOKE: ${{ vars.STRATLAKE_RUN_WHEEL_INSTALL_SMOKE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install release validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c requirements-dev.lock

      - name: Import smoke
        run: python -c "from src.artifacts.safety import portable_path; print(portable_path('docs\\manifest.json'))"

      - name: Run release pytest slice
        run: >
          python -m pytest
          tests/test_packaging_readiness.py
          tests/test_dependency_reproducibility.py
          tests/test_line_ending_policy.py
          tests/test_cross_platform_reproducibility_audit.py
          tests/test_portable_paths.py
          tests/test_docs_path_portability.py

      - name: Run docs/path lint
        run: python -m src.cli.run_docs_path_lint --output artifacts/qa/docs_path_lint_release.json

      - name: Build wheel and source distribution
        run: python -m build

      - name: Optional wheel install smoke test
        if: ${{ env.STRATLAKE_RUN_WHEEL_INSTALL_SMOKE == '1' }}
        run: STRATLAKE_RUN_WHEEL_INSTALL_SMOKE=1 python -m pytest tests/test_wheel_install_smoke.py -q

      - name: Render deterministic release notes
        shell: bash
        run: |
          mkdir -p artifacts/qa
          cat > artifacts/qa/release_notes.md <<EOF
          # ${GITHUB_REF_NAME}

          ## Summary

          Automated GitHub Release for \`${GITHUB_REF_NAME}\`.

          ## Validation

          - constrained editable install completed
          - packaging readiness tests passed
          - dependency reproducibility tests passed
          - line-ending policy tests passed
          - cross-platform audit and path portability tests passed
          - docs/path lint passed
          - package build validation completed

          ## Notes

          Package publication to PyPI/TestPyPI is out of scope for this release workflow.
          EOF

      - name: Upload release validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-validation
          path: |
            artifacts/qa/release_notes.md
            artifacts/qa/docs_path_lint_release.json
          if-no-files-found: error

      - name: Upload package build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-build
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          body_path: artifacts/qa/release_notes.md
          files: |
            artifacts/qa/release_notes.md
            artifacts/qa/docs_path_lint_release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
