schema_version: 1
profile: ci
description: Clean CI profile for deterministic checks without external services.
use_case: Parse, validation, unit, docs, and fixture-backed workflow checks.
settings:
  marketlake_root: data/curated
  features_root: data
  artifacts_root: artifacts/ci
  duckdb_path: ":memory:"
  log_level: INFO
  default_timezone: UTC
workflow_configs:
  config_dir: configs
  execution_config: configs/execution.yml
  sanity_config: configs/sanity.yml
  review_config: configs/review.yml
runtime:
  execution:
    enabled: false
  strict_mode:
    enabled: true
review:
  output:
    emit_plots: false
boundaries:
  direct_scan: true
  derived_outputs_authoritative: false
  mutates_canonical_artifacts: false
  requires_network: false
  requires_credentials: false
  requires_live_market_data: false
