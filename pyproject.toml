[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratlake-trade-engine"
version = "0.40.0"
description = "Deterministic, artifact-driven quantitative research and backtesting platform."
authors = [{ name = "Christopher Overton" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }  # only if MIT is actually correct

dependencies = [
    "pandas",
    "matplotlib",
    "duckdb",
    "jsonschema",
    "pyarrow",
    "python-dotenv",
    "pyyaml",
    "scipy",
    "scikit-learn",
    "xgboost",
    "lightgbm",
]

[project.urls]
Homepage = "https://github.com/christophermoverton/stratlake-trade-engine"
Repository = "https://github.com/christophermoverton/stratlake-trade-engine"
Issues = "https://github.com/christophermoverton/stratlake-trade-engine/issues"

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"docs/examples/**/*.py" = ["E402"]
"docs/examples/**/*.ipynb" = ["E402"]
